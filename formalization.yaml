fidelity:
  divergences: >-
    Right-handed notions are formalized through the opposite ring: IsRightPCIRing
    R is IsLeftPCIRing Rᵐᵒᵖ and IsRightVRing R is IsLeftVRing Rᵐᵒᵖ, the standard
    Mathlib idiom. A proper cyclic left module is taken as a quotient R ⧸ I by a
    left ideal that is not isomorphic to R; since every cyclic module is such a
    quotient and injectivity is invariant under isomorphism, this is the usual
    notion. IsLeftVRing quantifies over simple modules in the same universe as
    R. IsRightOre states that any two non-zero elements have a non-zero common
    right multiple. The compared statements live in universe Type. The paper
    works over an arbitrary countable commutative field k; the formalization
    takes k = ℚ, which suffices for the compared statements. Not compared: the
    Main Theorem's claims that the ring is simple, a principal left ideal
    domain, left Noetherian and left hereditary. Proposition 2.2 is formalized
    as in the paper, through Baer's criterion (every proper cyclic left module
    is divisible); its "left V" step is stated for an arbitrary ring that is
    not a division ring. "Not right PCI" and "not right V" are both derived
    from Lemma 2.4 (countability), as in the paper, without Cozzens–Faith 6.17;
    Lemma 2.4 is proved on the left and applied to Rᵐᵒᵖ. Construction 4.1 is
    formalized with Z = ℕ, the tasks (f, g, e) coded by an injection into ℕ and
    the generators indexed through a pairing function. Cohn's Theorem 3.1 is
    proved in the repository (LeftPCI.FreeAlgebra, LeftPCI.FreeField), not
    assumed; the Ore extension K[t; σ, δ] is built in the repository
    (LeftPCI.OrePoly), since Mathlib has only the case δ = 0. Of
    Corollary 2.6, items (1) and (3) are
    compared theorems; item (1) is stated for the Main Theorem's ring itself (a
    left PCI ring need not be right PCI), the paper's statement about the
    opposite ring read through Rᵐᵒᵖ, so both compared corollaries use the same
    ring; items (2) (not left Ore) and (4) (an Ore extension that
    is a left V-domain with σ not onto) are not stated separately in Lean: (2)
    is visible in the Main Theorem's statement (¬ IsRightOre R, for the
    opposite ring), and (4) in the construction, since the compared
    existential does not record that the witness is an Ore extension.


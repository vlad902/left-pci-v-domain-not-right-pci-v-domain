# formalization.yaml v0.4 (mathlib-initiative format, Palomar registry rules).
version: "v0.4"

project:
  name: "A left PCI left V-domain that is not right PCI and not a right V-domain"
  description: >-
    A countable domain R that is a left PCI ring (every cyclic left module not
    isomorphic to R is injective) and a left V-ring (every simple left module is
    injective), but is not right Ore, not a right PCI ring and not a right
    V-ring. Consequently the opposite ring of R is a right PCI ring that is not
    left PCI.

    This answers in the negative the question of Faith (1973), Cozzens and
    Faith (Simple Noetherian Rings, 1975) and Damiano (1979) whether every right
    PCI ring is left PCI, and the question, going back to Cozzens and Faith
    (1975), whether a left V-domain must be a right V-domain.

    The ring is an Ore extension K[t; σ, δ] over a free field K (Cohn's universal
    field of fractions of a free algebra over the rationals) with a non-surjective
    endomorphism σ. The endomorphism and the derivation are prescribed on the
    free generators of K so that every pseudo-linear equation governing
    divisibility of the cyclic modules R/Rf is solved by a vector of free
    generators.
    
    The mathematics, the accompanying paper and the Lean code were produced by AI
    models (Anthropic's Claude) at a human's direction; no human expert has checked
    the mathematics.
  authors:
    - "Vlad Tsyrklevich"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Vlad Tsyrklevich"

classification:
  arxiv: ["math.RA"]
  msc2020: ["16D50", "16S36", "16K40", "16S10"]


status:
  scope: >-
    Fully formalized. The final theorems in Challenge.lean are:
    LeftPCI.exists_isLeftPCIRing_not_isRightPCIRing (the Main
    Theorem's example: a countable domain that is left PCI and left V but not
    right Ore, not right PCI and not right V),
    LeftPCI.not_forall_isLeftPCIRing_imp_isRightPCIRing (a left PCI ring need
    not be right PCI; equivalently, via the opposite ring, a right PCI ring
    need not be left PCI), and
    LeftPCI.not_forall_isLeftVRing_imp_isRightVRing (a left V-domain need not
    be right V),
    are proved in the library LeftPCI and checked by Comparator.
    Not among the compared statements: the Main Theorem's further claims that
    the ring is simple, a principal left ideal domain, left Noetherian and left
    hereditary; and Corollary 2.6 (2) and (4) as separate statements (they are
    visible in the Main Theorem's statement and in the construction).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []


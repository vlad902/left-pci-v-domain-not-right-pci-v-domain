name = "LeftPCI"
version = "0.1.0"
defaultTargets = ["LeftPCI", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc2"

# The formal development: `LeftPCI.lean` imports every module, and `Solution.lean` imports it.
[[lean_lib]]
name = "LeftPCI"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
